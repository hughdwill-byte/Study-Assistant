name: Release

# Builds a self-contained, single-file Windows x64 executable and publishes it as a
# GitHub Release asset — so users get a downloadable StudyHud.exe instead of compiling.
#
# Triggers:
#   • push a tag like v0.1.0        → cuts the release for that tag
#   • run manually (workflow_dispatch, once this file is on the default branch) with a tag input
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload the asset

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if (-not $tag) { throw 'No tag resolved.' }
          "tag=$tag"                         >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))"   >> $env:GITHUB_OUTPUT
          "asset=StudyHud-$tag-win-x64.zip"  >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, single file, win-x64)
        shell: pwsh
        run: >
          dotnet publish src/StudyHud.App/StudyHud.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: Package
        shell: pwsh
        run: |
          # Drop any stray debug symbols, ship the exe + the guide.
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Copy-Item README.md publish/ -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath '${{ steps.ver.outputs.asset }}' -Force
          Get-ChildItem publish | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Study HUD ${{ steps.ver.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            **Study HUD ${{ steps.ver.outputs.tag }}** — early preview build.

            ### Download & run
            1. Download `${{ steps.ver.outputs.asset }}` below and unzip it.
            2. Run **`StudyHud.exe`**. No .NET install needed — this is a self-contained x64 build.
            3. Windows SmartScreen may warn about an unsigned app: *More info → Run anyway*.

            Requires **Windows 10/11 (64-bit)**. For the Question Finder's OCR you may need a
            Windows OCR language pack (Settings → Time & language → Language & region).

            See the [README](https://github.com/hughdwill-byte/Study-Assistant/blob/main/README.md)
            for setup (Notion token, courses, Assessment Mode). This is a pre-release: expect rough edges.
          files: ${{ steps.ver.outputs.asset }}
